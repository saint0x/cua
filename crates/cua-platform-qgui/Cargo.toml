[package]
name = "cua-platform-qgui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
cua-capture = { path = "../cua-capture" }
cua-computer = { path = "../cua-computer" }
cua-core = { path = "../cua-core" }
cua-input = { path = "../cua-input" }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
x11rb = { version = "0.13.2", features = ["xtest"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9.3"

[[bin]]
name = "cua-qgui-tool"
path = "src/bin/cua-qgui-tool.rs"

[dev-dependencies]
tempfile = "3.20"
