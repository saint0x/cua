[workspace]
resolver = "2"
members = [
  "crates/cua-cli",
  "crates/cua-client",
  "crates/cua-core",
  "crates/cua-capture",
  "crates/cua-daemon",
  "crates/cua-input",
  "crates/cua-model",
  "crates/cua-platform-macos",
  "crates/cua-trace",
  "frontends/cua-voice",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/saint0x/cua"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = { version = "0.7.9", features = ["ws", "macros"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.46", features = ["derive", "env"] }
cpal = "0.18.2"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures = "0.3.31"
gpui = "0.2.2"
hound = "3.5.1"
hmac = "0.12.1"
http = "1.3.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
mime = "0.3.17"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
schemars = { version = "0.8.22", features = ["chrono"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "fs", "io-util", "process"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
toml = "0.8.23"
uuid = { version = "1.18.0", features = ["v4", "serde"] }

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
